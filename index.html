<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボツ音源アーカイブ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="page-header">
    <h1>ボツ音源アーカイブ</h1>
    <div class="stats" id="stats">読み込み中...</div>
  </header>

  <!-- 曲リストコンテナ（JavaScriptで自動取得・描画） -->
  <main id="album-list"></main>

  <!-- 音楽プレイヤー -->
  <div class="player" id="player">
    <button id="compress-bar" title="プレイヤー切り替え"></button>

    <div class="album-art">
      <img src="default.jpg" alt="ジャケット写真" id="playerArt">
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">曲を選択してください</div>
      <div class="artist-name" id="artistName">未発表デモ</div>
      <div class="track-date" id="trackDate">----.--.--</div>
      <div class="lufs-badge" id="lufsBadge">Target: -14 LUFS</div>
    </div>

    <div class="progress-container">
      <span class="current-time" id="currentTime">0:00</span>
      <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
      <span class="duration" id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="back-btn" id="backBtn" title="前の曲">⏮</button>
      <button class="play-btn" id="playBtn" title="再生/一時停止">▶</button>
      <button class="skip-btn" id="skipBtn" title="次の曲">⏭</button>
    </div>

    <div class="volume-container">
      <span class="volume-icon">🔈</span>
      <input type="range" class="volume-bar" id="volumeBar" min="0" max="100" value="70">
      <span class="volume-icon">🔊</span>
    </div>

    <div class="information-container">
      <button class="repeat-btn" id="repeatBtn" title="リピート切替">🔁</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
